packages:
  - apps/*
  - packages/*

# Expo SDK 58 beta owns the React / RN / Metro compatibility matrix.
# Keep these overrides aligned with the SDK 58 template instead of forcing
# upstream "latest" versions that Expo has not validated together.
overrides:
  lightningcss: 1.30.1
  react: 19.3.0
  react-dom: 19.3.0
  "@expo/dom-webview": 58.0.1

onlyBuiltDependencies:
  - sharp
  - unrs-resolver
  - esbuild

# One version per dependency, declared once. Package manifests consume catalog:.
catalog:
  # Expo SDK 58 beta / React Native 0.88 lane
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.0-rc.2
  react-native-web: 0.21.2
  expo: 58.0.0-preview.8
  "@expo/metro-runtime": 58.0.7
  expo-asset: 58.0.8
  expo-font: 58.0.3
  expo-haptics: 58.0.2
  expo-image: 58.0.7
  expo-document-picker: 58.0.2
  expo-image-picker: 58.0.8
  expo-glass-effect: 58.0.2
  expo-symbols: 58.0.2
  "@expo/material-symbols": 0.1.1
  expo-linking: 58.0.8
  expo-router: 58.0.9
  expo-splash-screen: 58.0.1
  expo-status-bar: 58.0.1
