name: Bake GNM MCP Head

on:
  push:
    branches:
      - feat/gnm-mcp-baked-head
    paths:
      - tooling/gnm-mcp/.bake-trigger

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gnm-mcp-baked-head
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight baker dependencies
        run: python -m pip install --disable-pip-version-check numpy trimesh

      - name: Download official XR Blocks GNM v3 container
        run: |
          mkdir -p .cache/gnm
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/xrblocks/assets-gnm/35ab2adcfd38ebc8741b89c8fa96b19e39076cf8/gnm_head_web.bin" \
            --output .cache/gnm/gnm_head_web.bin
          test "$(wc -c < .cache/gnm/gnm_head_web.bin)" -eq 34937952

      - name: Bake deterministic MCP GLB
        run: |
          python tooling/gnm-mcp/bake_xrblocks_gnm_head.py \
            --source .cache/gnm/gnm_head_web.bin \
            --output apps/web/public/assets/mcp/mcp-gnm-head.glb \
            --seed 1982
          python - <<'PY'
          import json
          from pathlib import Path
          import trimesh

          asset = Path("apps/web/public/assets/mcp/mcp-gnm-head.glb")
          provenance = asset.with_suffix(".provenance.json")
          assert asset.is_file() and asset.stat().st_size > 100_000
          assert provenance.is_file()
          scene = trimesh.load(asset, force="scene")
          assert len(scene.geometry) >= 2
          print(json.dumps({
              "asset_bytes": asset.stat().st_size,
              "geometry_count": len(scene.geometry),
              "provenance": json.loads(provenance.read_text()),
          }, indent=2))
          PY

      - name: Commit baked runtime asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/assets/mcp/mcp-gnm-head.glb
          git add apps/web/public/assets/mcp/mcp-gnm-head.provenance.json
          if git diff --cached --quiet; then
            echo "Baked asset unchanged."
            exit 0
          fi
          git commit -m "feat(mcp): bake Google GNM runtime head"
          git push origin HEAD:feat/gnm-mcp-baked-head
