name: SDK 58 dependency audit

on:
  push:
    branches:
      - chore/sdk58-native-ui-modernization

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture latest npm versions
        shell: bash
        run: |
          set +e
          pnpm outdated -r --format json > outdated.json
          test -s outdated.json || echo '{}' > outdated.json
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: sdk58-dependency-audit
          path: outdated.json
          if-no-files-found: error
