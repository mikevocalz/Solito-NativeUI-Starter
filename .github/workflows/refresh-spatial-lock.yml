name: Refresh spatial lockfile

on:
  push:
    branches:
      - spatial-solotio-starter

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.7.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0

      - run: pnpm install --no-frozen-lockfile

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: refresh pnpm lockfile"
          git push origin HEAD:spatial-solotio-starter
