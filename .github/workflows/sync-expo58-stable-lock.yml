name: Sync Expo 58 Stable Lock

on:
  push:
    branches:
      - feat/mcp-voice-emotion
    paths:
      - .github/workflows/sync-expo58-stable-lock.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/mcp-voice-emotion
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.7.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: pnpm

      - name: Regenerate lockfile for stable Expo SDK 58
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml pnpm-workspace.yaml
          git rm .github/workflows/sync-expo58-stable-lock.yml
          git commit -m "chore(expo): lock stable SDK 58 dependency graph"
          git push origin HEAD:feat/mcp-voice-emotion
