name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -v '\.env\.example$'; then
            echo '::error::.env files must never be committed'; exit 1
          fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Single source of truth for the Node floor (RN 0.87 requires >= 22.13.0).
          # Bump .nvmrc and the root package.json "engines" together.
          node-version-file: .nvmrc
          cache: pnpm
      - name: Refresh lockfile for dependency-refresh branch
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/refresh-sdk58-spatial-stack-2026-10-02'
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: refresh pnpm lockfile"
            git push origin HEAD:chore/refresh-sdk58-spatial-stack-2026-10-02
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm spatial:verify-android
      - run: pnpm spatial:verify-typegpu
      - run: pnpm --filter @acme/spatial test
      - run: pnpm turbo build typecheck lint
