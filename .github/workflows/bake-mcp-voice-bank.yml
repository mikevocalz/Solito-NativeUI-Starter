name: Bake MCP Voice Bank

on:
  push:
    branches:
      - feat/mcp-voice-emotion
    paths:
      - .github/workflows/bake-mcp-voice-bank.yml
      - tooling/mcp-voice/bake_voxcpm2_bank.py

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-24.04
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/mcp-voice-emotion
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install "voxcpm>=2.0.3" soundfile

      - name: Bake VoxCPM2 MCP voice bank
        env:
          HF_HUB_DISABLE_XET: "1"
        run: |
          python tooling/mcp-voice/bake_voxcpm2_bank.py

      - name: Commit generated voice bank and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/spatial/assets/mcp/voice apps/web/public/assets/mcp/voice tooling/mcp-voice/bake_voxcpm2_bank.py
          git rm .github/workflows/bake-mcp-voice-bank.yml
          git commit -m "feat(mcp): bake VoxCPM2 voice bank"
          git push origin HEAD:feat/mcp-voice-emotion
